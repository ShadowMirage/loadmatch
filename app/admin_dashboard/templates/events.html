<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoadMatch Live Events</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #2c3e50; }
        
        .section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f9fbfb; color: #7f8c8d; font-weight: 600; }
        tr:hover { background-color: #f1f5f8; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #3498db; color: white; }
        .data-cell { font-family: monospace; font-size: 12px; color: #666; max-width: 400px; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Webhook Viewer <a href="/dashboard" style="font-size: 16px; float: right; margin-top: 10px; text-decoration: none; color: #3498db;">« Back to Operations</a></h1>
        
        <div class="section">
            <h2>Recent System Events</h2>
            <table>
                <tr><th>Time</th><th>Event</th><th>Phone</th><th>Data</th></tr>
                {% for evt in events %}
                <tr>
                    <td>{{ evt.created_at[11:16] }}</td>
                    <td><span class="badge">{{ evt.event_type }}</span></td>
                    <td>{{ evt.user_phone }}</td>
                    <td class="data-cell">{{ evt.data }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
